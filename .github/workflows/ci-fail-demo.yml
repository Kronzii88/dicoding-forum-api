name: CI Fail Demo

on:
  pull_request:
    branches:
      - main

jobs:
  fail_demo:
    runs-on: ubuntu-latest
    steps:
      - name: Fail only for ci-fail/* branches (but never skip)
        shell: bash
        run: |
          echo "head_ref=${{ github.head_ref }}"
          if [[ "${{ github.head_ref }}" == ci-fail/* ]]; then
            echo "Failing CI (demo) because branch name matches ci-fail/*"
            exit 1
          fi
          echo "Passing CI (demo) because branch name does not match ci-fail/*"
