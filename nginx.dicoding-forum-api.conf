limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

server {
  listen 80;
  listen [::]:80;
  server_name dicoding-forum-api.ezarofi.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name dicoding-forum-api.ezarofi.com;

  ssl_certificate /etc/letsencrypt/live/dicoding-forum-api.ezarofi.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dicoding-forum-api.ezarofi.com/privkey.pem;

  location ^~ /threads {
    limit_req zone=threads_limit burst=30 nodelay;

    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
