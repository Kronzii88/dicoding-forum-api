limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

server {
    server_name dicoding-forum-api.ezarofi.com;

    # SSL Managed by Certbot
    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/dicoding-forum-api.ezarofi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dicoding-forum-api.ezarofi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy Headers Global (Agar Express mengenali IP asli user)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';

    # A. Endpoint khusus Thread dengan Rate Limit
    location ^~ /threads {
        limit_req zone=threads_limit;
        proxy_pass http://127.0.0.1:5000;
    }

    # B. Endpoint API lainnya
    location / {
        proxy_pass http://127.0.0.1:5000;
    }
}

# 3. BLOK HTTP (Redirect ke HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name dicoding-forum-api.ezarofi.com;

    # Redirect semua trafik non-SSL ke SSL
    location / {
        return 301 https://$host$request_uri;
    }

    # Penting untuk verifikasi perpanjangan sertifikat Certbot di masa depan
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
